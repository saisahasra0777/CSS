<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ludo Board</title>
    <link rel="stylesheet" href="ludo.css">
</head>
<body>
    <div class="board">
        <div class="home green">
            <div class="inner">
                <div class="coin green"></div>
                <div class="coin green"></div>
                <div class="coin green"></div>
                <div class="coin green"></div>
            </div>
        </div>
        <div class="path vertical">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box red"></div>
            <div class="box red"></div>
            <div class="box"></div>
            <div class="box red"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box red"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box red"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box red"></div>
            <div class="box"></div>
        </div>
        <div class="home red">
            <div class="inner">
                <div class="coin red"></div>
                <div class="coin red"></div>
                <div class="coin red"></div>
                <div class="coin red"></div>
            </div>
        </div>
        <div class="path horizontal">
            <div class="box"></div>
            <div class="box green"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box green"></div>
            <div class="box green"></div>
            <div class="box green"></div>
            <div class="box green"></div>
            <div class="box green"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
        <div class="center">
            <div class="triangle red"></div>
            <div class="triangle blue"></div>
            <div class="triangle yellow"></div>
            <div class="triangle green"></div>
        </div>
        <div class="path horizontal">
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box blue"></div>
            <div class="box blue"></div>
            <div class="box blue"></div>
            <div class="box blue"></div>
            <div class="box blue"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box blue"></div>
            <div class="box"></div>
        </div>
        <div class="home yellow">
            <div class="inner">
                <div class="coin yellow"></div>
                <div class="coin yellow"></div>
                <div class="coin yellow"></div>
                <div class="coin yellow"></div>
            </div>
        </div>
        <div class="path vertical">
            <div class="box"></div>
            <div class="box yellow"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box yellow"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box yellow"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box yellow"></div>
            <div class="box"></div>
            <div class="box yellow"></div>
            <div class="box yellow"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
            <div class="box"></div>
        </div>
        <div class="home blue">
            <div class="inner">
                <div class="coin blue"></div>
                <div class="coin blue"></div>
                <div class="coin blue"></div>
                <div class="coin blue"></div>
            </div>
        </div>
    </div>
</body>
</html>
